{{- /*
  By default the release namespace is provisioned by `helm --create-namespace`
  (see deployment.sh), so templating a Namespace here collides with the
  helm-created one ("namespaces ... already exists"). Render it only when the
  caller explicitly opts in with `--set createNamespaceResource=true` and is
  NOT relying on --create-namespace.
*/ -}}
{{- if .Values.createNamespaceResource }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "sympozium.namespace" . }}
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
